name: PR Review comment

# Trusted companion to "PR Review Bot". The review runs PR code on pull_request, so on fork PRs its
# token is read-only and it can't comment. This runs when that review finishes, downloads its report
# artifact and posts it with the base repo's token. Never checks out PR code; the report is only
# posted as markdown.

on:
  workflow_run:
    workflows: ["PR Review Bot"]
    types:
      - completed

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  comment:
    name: Post review comment
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      # A fork PR run's pull_requests array is empty, so find the PR by owner:branch.
      - name: Resolve PR number
        id: pr
        run: |
          number=$(gh api -X GET "repos/$REPO/pulls" -f state=open \
            -f head="${HEAD_REPO%%/*}:$HEAD_BRANCH" --jq '.[0].number // empty')
          [ -n "$number" ] || echo "::notice::No open PR for $HEAD_REPO:$HEAD_BRANCH; skipping comment."
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Download review report
        if: steps.pr.outputs.number != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pr-review-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # GitHub rejects comments over 65536 characters.
      - name: Check report
        id: report
        if: steps.pr.outputs.number != ''
        run: |
          if [ ! -s review-report.md ]; then
            echo "::notice::The review run produced no report; skipping comment."
            exit 0
          fi
          if [ "$(wc -c < review-report.md)" -gt 60000 ]; then
            head -c 60000 review-report.md > short.md
            printf '\n\n_Report truncated. Full report: the pr-review-report artifact on the PR Review Bot run._\n' >> short.md
            mv short.md review-report.md
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        if: steps.report.outputs.found == 'true'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: pr-review-bot
          number: ${{ steps.pr.outputs.number }}
          path: review-report.md
