name: PR build

# Runs in contributor forks with the fork's own config (APP_ENV_FILE) and Actions minutes.
# Builds only when this branch has an open PR into the review repo, so work-in-progress pushes cost nothing.
# The review repo's fork-build.yml reads this run's result for the PR's head commit.
#
# First build after opening a PR: Actions -> PR build -> Run workflow on the branch (or push a commit).

on:
  push:
    branches:
      - "feat/**"
      - "fix/**"
      - "test/**"
      - "docs/**"
      - "refactor/**"
      - "chore/**"
      - "perf/**"
      - "security/**"
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Open PR check
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.pr.outputs.build }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_REPO: ${{ vars.REVIEW_REPO || format('zedu-hng/{0}', github.event.repository.name) }}
          OWNER: ${{ github.repository_owner }}
          BRANCH: ${{ github.ref_name }}
        run: |
          number=$(gh api -X GET "repos/$REVIEW_REPO/pulls" -f state=open -f head="$OWNER:$BRANCH" --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            echo "Open PR $REVIEW_REPO#$number from $OWNER:$BRANCH; building."
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No open PR from $OWNER:$BRANCH into $REVIEW_REPO; skipping build. Open the PR, then run this workflow or push."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  android:
    name: Android APK
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      # .env.* files are blocked by security-checks, so backend config lives in the APP_ENV_FILE repo variable (each fork sets its own).
      - name: Write .env
        env:
          APP_ENV_FILE: ${{ vars.APP_ENV_FILE }}
        run: |
          if [ -z "$APP_ENV_FILE" ]; then
            echo "::warning::APP_ENV_FILE variable not set; building with an empty .env (app will not reach a backend)."
          fi
          printf '%s\n' "$APP_ENV_FILE" > .env

      - name: Assemble release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    name: iOS simulator build
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Gemfile.lock targets Ruby 2.7 / Bundler 2.1 (unavailable on macos-15), so skip Bundler and
      # install the exact CocoaPods version recorded in Podfile.lock instead.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install CocoaPods
        run: gem install cocoapods -v "$(awk '/^COCOAPODS:/{print $2}' ios/Podfile.lock)" --no-document

      - name: Install dependencies
        run: npm ci

      - name: Write .env
        env:
          APP_ENV_FILE: ${{ vars.APP_ENV_FILE }}
        run: |
          if [ -z "$APP_ENV_FILE" ]; then
            echo "::warning::APP_ENV_FILE variable not set; building with an empty .env (app will not reach a backend)."
          fi
          printf '%s\n' "$APP_ENV_FILE" > .env

      - name: Install pods
        working-directory: ios
        run: pod install

      # Release config bundles the JS so the .app runs without Metro; simulator builds need no signing.
      # arm64 only: AgoraReplayKitExtension (ScreenSharing target) has no usable x86_64 simulator slice.
      - name: Build for simulator
        run: |
          xcodebuild \
            -workspace ios/Zedu.xcworkspace \
            -scheme Zedu \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            build

      - name: Zip .app
        run: |
          cd ios/build/Build/Products/Release-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent Zedu.app "$GITHUB_WORKSPACE/Zedu-simulator.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: Zedu-simulator.zip
          if-no-files-found: error
          retention-days: 14
