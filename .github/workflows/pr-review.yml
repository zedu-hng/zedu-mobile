name: PR Review Bot

on:
  pull_request:
    branches:
      - main
      - central-staging
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      # Tier 1: every push in a contributor fork runs the checks.
      - "**"

concurrency:
  group: pr-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-review:
    name: Structure, reuse, URLs, and secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Review with the base branch's rules, not the copy frozen into this PR's test-merge ref.
      # GitHub only refreshes refs/pull/<n>/merge on PR events, so a merged config fix would
      # otherwise keep producing a stale verdict. .github/ is protected, so the base copy is trusted.
      - name: Use the base branch's review rules
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          git checkout FETCH_HEAD -- .github/pr-review.config.json .github/scripts/pr-review

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run PR review
        id: review
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node .github/scripts/pr-review/run.mjs \
              --base "origin/${{ github.base_ref }}" \
              --head HEAD \
              --config .github/pr-review.config.json \
              --output review-report.json
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.event.after }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="HEAD~1"
            fi
            node .github/scripts/pr-review/run.mjs \
              --base "$BEFORE" \
              --head "$AFTER" \
              --config .github/pr-review.config.json \
              --output review-report.json
          fi

      # Upload instead of commenting: this job runs PR code, so fork PRs get a read-only token.
      # pr-review-comment.yml posts the report with a trusted token once this run completes.
      - name: Upload review report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-review-report
          path: |
            review-report.md
            review-report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail on review errors
        if: steps.review.outcome == 'failure'
        run: exit 1
