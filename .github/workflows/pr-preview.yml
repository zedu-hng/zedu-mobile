name: PR preview

# Stage B: trusted context with secrets. Runs this file from the default branch, never checks out
# PR code, and only consumes artifacts produced by "PR build".
#
# Config (all optional; each publish step is skipped when its secret is missing):
#   secrets.FIREBASE_SERVICE_ACCOUNT   JSON key with the Firebase App Distribution Admin role
#   vars.FIREBASE_ANDROID_APP_ID       e.g. 1:1234567890:android:abc123
#   vars.FIREBASE_TESTER_GROUPS        comma-separated group aliases for PR builds (default: reviewers)
#   vars.FIREBASE_STAGING_GROUPS       comma-separated group aliases for staging pushes (default: staging)
#   secrets.APPETIZE_API_TOKEN         Appetize API token

on:
  workflow_run:
    workflows:
      - PR build
    types:
      - completed

permissions:
  contents: read

jobs:
  publish:
    name: Publish review builds
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      pull-requests: write
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
      APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: artifacts

      # Event type comes from the trusted workflow_run payload. meta/pr_number was written by
      # untrusted code: validate its format, then confirm the PR's head matches this run.
      - name: Resolve PR
        id: pr
        env:
          WR_EVENT: ${{ github.event.workflow_run.event }}
          WR_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          WR_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          case "$WR_EVENT" in
            pull_request) ;;
            push)
              [ "$WR_REPO" = "$REPO" ] && [ "$WR_BRANCH" = "staging" ] || { echo "Push run not on $REPO@staging; nothing to publish"; exit 1; }
              echo "number=" >> "$GITHUB_OUTPUT"; echo "kind=push" >> "$GITHUB_OUTPUT"; exit 0 ;;
            *) echo "Event '$WR_EVENT' is not published"; echo "kind=none" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          number=$(cat artifacts/meta/pr_number)
          [[ "$number" =~ ^[0-9]+$ ]] || { echo "Invalid PR number"; exit 1; }
          pr_head=$(gh api "repos/$REPO/pulls/$number" --jq .head.sha)
          [ "$pr_head" = "$HEAD_SHA" ] || { echo "PR #$number head $pr_head != run head $HEAD_SHA (stale run?)"; exit 1; }
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "kind=pull_request" >> "$GITHUB_OUTPUT"

      - name: Firebase App Distribution
        id: firebase
        if: env.FIREBASE_SERVICE_ACCOUNT != '' && env.FIREBASE_ANDROID_APP_ID != '' && (steps.pr.outputs.kind == 'pull_request' || steps.pr.outputs.kind == 'push')
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          KIND: ${{ steps.pr.outputs.kind }}
          PR_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'reviewers' }}
          STAGING_GROUPS: ${{ vars.FIREBASE_STAGING_GROUPS || 'staging' }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          if [ "$KIND" = "pull_request" ]; then
            groups="$PR_GROUPS"; notes="PR #$PR_NUMBER @ ${HEAD_SHA:0:7}"
          else
            groups="$STAGING_GROUPS"; notes="staging @ ${HEAD_SHA:0:7}"
          fi
          npx --yes firebase-tools@latest appdistribution:distribute artifacts/android-apk/app-release.apk \
            --app "$FIREBASE_ANDROID_APP_ID" \
            --groups "$groups" \
            --release-notes "$notes"
          echo "groups=$groups" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/sa.json"

      - name: Appetize
        id: appetize
        if: env.APPETIZE_API_TOKEN != '' && steps.pr.outputs.kind == 'pull_request'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          upload() {
            curl -sSf -X POST https://api.appetize.io/v1/apps \
              -H "X-API-KEY: $APPETIZE_API_TOKEN" \
              -F "file=@$1" -F "platform=$2" -F "note=PR #$PR_NUMBER @ ${HEAD_SHA:0:7}" \
              | jq -r .publicKey
          }
          android_key=$(upload artifacts/android-apk/app-release.apk android)
          ios_key=$(upload artifacts/ios-simulator/Zedu-simulator.zip ios)
          echo "android=https://appetize.io/app/$android_key" >> "$GITHUB_OUTPUT"
          echo "ios=https://appetize.io/app/$ios_key" >> "$GITHUB_OUTPUT"

      - name: Compose comment
        if: steps.pr.outputs.kind == 'pull_request'
        env:
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          FB_GROUPS: ${{ steps.firebase.outputs.groups }}
          APPETIZE_ANDROID: ${{ steps.appetize.outputs.android }}
          APPETIZE_IOS: ${{ steps.appetize.outputs.ios }}
        run: |
          {
            echo "### Review builds for \`${HEAD_SHA:0:7}\`"
            echo
            echo "- **Artifacts** (APK + iOS simulator .app): [build run]($RUN_URL)"
            if [ -n "$FB_GROUPS" ]; then
              echo "- **Android install**: sent via Firebase App Distribution to \`$FB_GROUPS\` (check your tester email / App Tester app)"
            fi
            if [ -n "$APPETIZE_ANDROID" ]; then
              echo "- **Try in browser**: [Android]($APPETIZE_ANDROID) · [iOS]($APPETIZE_IOS)"
            fi
          } > comment.md

      - uses: marocchino/sticky-pull-request-comment@v2
        if: steps.pr.outputs.kind == 'pull_request'
        with:
          header: review-builds
          number: ${{ steps.pr.outputs.number }}
          path: comment.md

      - name: Commit status
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=$([ "$JOB_STATUS" = "success" ] && echo success || echo failure)
          gh api "repos/$REPO/statuses/$HEAD_SHA" \
            -f state="$state" -f context="PR preview / publish" \
            -f target_url="$RUN_URL" -f description="Review build publishing: $JOB_STATUS"
